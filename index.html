<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Molinaro ESCo — Accesso Magazzino</title>
<meta name="theme-color" content="#4DAB3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand-500:#4DAB3D;--brand-600:#3D8B2E;--brand-700:#2D6A21;
  --brand-50:#EAF5E3;--brand-100:#D4ECCA;
  --bg:#F7F8F5;--bg-card:#fff;--bg-surface:#EEF1EA;
  --text:#1A1A1A;--text-muted:#5E6B5E;--text-light:#9AA39A;
  --border:#E3E6DF;
  --radius:14px;--radius-sm:10px;
  --shadow-lg:0 1px 3px rgba(40,60,40,.04),0 24px 64px rgba(40,60,40,.14);
  --shadow-brand:0 4px 12px rgba(77,171,61,.25);
  --transition:.2s cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'DM Sans',-apple-system,sans-serif;
  min-height:100%;
  background:#4DAB3D;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}

.login-card{
  width:100%;max-width:400px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow-lg);
  padding:32px 26px 28px;
  text-align:center;
  position:relative;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;
  top:0;left:28px;right:28px;height:4px;
  border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--brand-500),var(--brand-700));
}
.login-logo{height:50px;object-fit:contain;margin-bottom:20px}
.login-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brand-500);
}
.login-title{
  font-size:24px;font-weight:700;color:var(--text);
  margin-top:8px;letter-spacing:-.5px;line-height:1.15;
}
.login-subtitle{
  font-size:13px;color:var(--text-muted);
  margin:10px auto 28px;max-width:300px;line-height:1.5;font-weight:500;
}

.form-group{margin-bottom:14px;text-align:left}
.form-group label{
  display:block;font-size:11px;font-weight:600;
  color:var(--text-muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.05em;
}
.form-group input{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:15px;font-family:inherit;
  background:var(--bg);color:var(--text);
  outline:none;transition:var(--transition);
}
.form-group input:focus{
  border-color:var(--brand-500);
  background:var(--bg-card);
  box-shadow:0 0 0 3px rgba(77,171,61,.1);
}
.form-group input::placeholder{color:var(--text-light)}

.login-btn{
  width:100%;padding:14px;margin-top:6px;
  background:var(--brand-500);color:#fff;
  border:none;border-radius:var(--radius-sm);
  font-size:15px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:var(--transition);
  box-shadow:var(--shadow-brand);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.login-btn:hover{background:var(--brand-600)}
.login-btn:active{transform:scale(.98)}
.login-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

.login-error{
  margin-top:14px;padding:11px 14px;
  background:#FDF5F5;border:1px solid #F0C0C0;
  border-radius:var(--radius-sm);
  color:#B33A3A;font-size:13px;font-weight:500;
  text-align:left;display:none;
}
.login-error.show{display:block}

.login-footer{
  margin-top:22px;padding-top:16px;
  border-top:1px solid var(--border);
  font-size:11px;color:var(--text-light);font-weight:500;
}

.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="login-card">
  <img src="logo-molinaro.png" class="login-logo" alt="Molinaro ESCo">
  <div class="login-eyebrow">Molinaro ESCo</div>
  <div class="login-title">Accesso Magazzino</div>
  <div class="login-subtitle">Inserisci le tue credenziali per accedere alla gestione del magazzino aziendale.</div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="login-email" placeholder="nome@molinaroservizi.it" autocomplete="email" inputmode="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="login-btn" id="login-btn" onclick="doLogin()">
    <span id="btn-label">Accedi</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="login-error" id="login-error"></div>

  <div class="login-footer">WebApp Magazzino · Molinaro ESCo</div>
</div>

<script type="module">
import { auth } from './firebase.js';
import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// Se già loggato → vai direttamente all'app
onAuthStateChanged(auth, user => {
  if (user) window.location.replace('app.html');
});

window.doLogin = async function() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('login-btn');
  const spinner  = document.getElementById('spinner');
  const label    = document.getElementById('btn-label');
  const errEl    = document.getElementById('login-error');

  if (!email || !password) {
    showError('Inserisci email e password.');
    return;
  }

  // Loading state
  btn.disabled   = true;
  spinner.style.display = 'block';
  label.textContent = 'Accesso in corso...';
  errEl.classList.remove('show');

  try {
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged gestirà il redirect
  } catch (e) {
    btn.disabled  = false;
    spinner.style.display = 'none';
    label.textContent = 'Accedi';

    const msgs = {
      'auth/invalid-credential':      'Email o password non corretti.',
      'auth/user-not-found':          'Nessun account trovato con questa email.',
      'auth/wrong-password':          'Password non corretta.',
      'auth/too-many-requests':       'Troppi tentativi. Riprova tra qualche minuto.',
      'auth/invalid-email':           'Formato email non valido.',
      'auth/network-request-failed':  'Errore di rete. Controlla la connessione.',
    };
    showError(msgs[e.code] || 'Errore di accesso. Riprova.');
  }
};

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.classList.add('show');
}

// Enter per fare login
document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});
document.getElementById('login-email').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-password').focus();
});
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(r=>console.log('[SW] Registrato')).catch(e=>console.warn('[SW] Errore:',e));
}
</script>
</body>
</html>
